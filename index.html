<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cóndor & Águila — El Despertar</title>
  
  <!-- Fuentes para estética clásica/pergamino -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --deepblue: #0C1426;
      --gold: #B08C34;
      --golddark: #785A16;
      --goldlight: #E1CD91;
      --heartred: #9E1E2D;
      --textgray: #23211E;
      --cream: #FDFAF4;
      --framegold: #A2802A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #12161a;
      color: var(--textgray);
      font-family: 'Cormorant Garamond', Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
    }

    /* BARRA SUPERIOR DE IDIOMAS */
    .lang-header {
      width: 100%;
      max-width: 1100px;
      margin-bottom: 20px;
    }

    .lang-switcher {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      background-color: var(--deepblue);
      padding: 10px 14px;
      border: 1px solid var(--gold);
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .btn-lang {
      background: rgba(225, 205, 145, 0.08);
      border: 1px solid rgba(176, 140, 84, 0.3);
      color: var(--goldlight);
      padding: 5px 10px;
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-lang:hover {
      background-color: rgba(176, 140, 84, 0.3);
      border-color: var(--goldlight);
      transform: translateY(-1px);
    }

    .btn-lang.active {
      background-color: var(--gold);
      color: var(--deepblue);
      border-color: var(--goldlight);
      box-shadow: 0 0 8px rgba(225, 205, 145, 0.5);
    }

    /* MARCO ESTILO PERGAMINO */
    .page-frame {
      background-color: var(--cream);
      max-width: 1100px;
      width: 100%;
      padding: 25px;
      border: 3px double var(--framegold);
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    /* GRIDS Y LAYOUT */
    .grid-header {
      display: grid;
      grid-template-columns: 1fr 2.5fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .grid-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .grid-subcolumns {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    /* ESTILO DE LAS CAJAS */
    .box {
      background-color: var(--cream);
      border: 1px solid var(--gold);
      border-radius: 6px;
      padding: 12px;
      position: relative;
    }

    .title-box {
      background-color: rgba(225, 205, 145, 0.15);
      text-align: center;
    }

    .quote-box {
      background-color: rgba(225, 205, 145, 0.25);
      font-style: italic;
    }

    .final-quote {
      text-align: center;
      font-style: italic;
      font-size: 1.1rem;
      background-color: rgba(176,140,52,0.1);
      border-width: 2px;
      margin-top: 12px;
    }

    /* TIPOGRAFÍA */
    h1, h2, h3 {
      font-family: 'Cinzel', serif;
      color: var(--deepblue);
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--golddark);
      font-size: 0.9rem;
      font-weight: bold;
    }

    p {
      line-height: 1.35;
      font-size: 0.98rem;
      text-align: justify;
    }

    @media (max-width: 800px) {
      .grid-header, .grid-columns, .grid-subcolumns {
        grid-template-columns: 1fr;
      }
      .btn-lang {
        font-size: 0.7rem;
        padding: 4px 8px;
      }
    }
  </style>
</head>
<body>

  <!-- BARRA DE SELECCIÓN DE IDIOMAS DINÁMICA -->
  <div class="lang-header">
    <div id="lang-switcher" class="lang-switcher">
      <!-- Los botones se cargan dinámicamente según los archivos JSON existentes -->
    </div>
  </div>

  <!-- CONTENIDO DEL DOCUMENTO -->
  <div class="page-frame">

    <!-- CABECERA SUPERIOR -->
    <div class="grid-header">
      <div class="box" style="text-align: center;">
        <h3 data-i18n="condor_title"></h3>
        <img src="./images/TU_IMAGEN_CONDOR.jpg" alt="Condor" style="max-width: 150px; height: auto; margin: 0 auto 15px auto; display: block;">
        <p class="subtitle" data-i18n="condor_sub"></p>
      </div>

      <div class="box title-box">
        <h1 data-i18n="main_title"></h1>
        <p class="subtitle" style="text-align: center;" data-i18n="main_sub"></p>
        <hr style="margin: 6px 0; border: 0; border-top: 1px solid var(--gold);">
        <p style="font-size: 0.88rem;" data-i18n="header_desc"></p>
      </div>     
     
      <div class="box" style="text-align: center;">
        <h3 data-i18n="eagle_title"></h3>
        <img src="./images/TU_IMAGEN_AGUILA.jpg" alt="Aguila" style="max-width: 150px; height: auto; margin: 0 auto 15px auto; display: block;">
        <p class="subtitle" data-i18n="eagle_sub"></p>
      </div>
    </div>

    <div>
      <div class="box" style="margin-bottom: 10px;">
        <h2 style="text-align: center;" data-i18n="left_title"></h2>
        <p data-i18n="left_body"></p>
      </div>
    </div>

    <div class="grid-subcolumns">
      <div class="box">
        <h3 data-i18n="universe_light_title"></h3>
        <p class="subtitle" data-i18n="universe_light_sub"></p>
        <p style="font-size: 0.85rem;" data-i18n="universe_light_text"></p>
      </div>

      <div class="box">
        <img src="./images/sophiavsdemiurgo.png" alt="SofiavsDemiurgo" style="max-width: 90%; height: auto; margin: 0 auto 15px auto; display: block; border-radius: 4px;">
        <p class="subtitle" style="font-size: 0.85rem; text-align: justify;" data-i18n="center_text"></p>
      </div>

      <div class="box">
        <h3 data-i18n="universe_mat_title"></h3>
        <p class="subtitle" data-i18n="universe_mat_sub"></p>
        <p style="font-size: 0.85rem;" data-i18n="universe_mat_text"></p>
      </div>
    </div>

    <div class="box quote-box">
      <p data-i18n="sagan_quote"></p>
      <p style="text-align: right; font-weight: bold; margin-top: 5px;"></p>
    </div>
	
    <div class="box" style="margin-bottom: 12px; text-align: center;">
      <h2 style="margin-bottom: 10px;" data-i18n="video_title"></h2>
      <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 900px; margin: 0 auto; border-radius: 6px; border: 1px solid var(--gold);">
        <iframe
          id="documentary-video"
          title="El Despertar" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen
          style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
        </iframe>
      </div>
    </div>

    <div class="box final-quote">
      <p data-i18n="final_quote"></p>
    </div>

  </div>

  <!-- CONFIGURACIÓN EXTERNA DEL VIDEO -->
  <script src="config.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const videoFrame = document.getElementById("documentary-video");
      if (videoFrame && typeof VIDEO_URL !== "undefined") {
        videoFrame.src = VIDEO_URL;
      }
    });
  </script>

  <!-- CARGA DINÁMICA DESDE index_data.json Y VERIFICACIÓN DE ARCHIVOS JSON -->
  <script>
    const translations = {};
    let currentLang = "es";

    async function applyLanguage(lang) {
      if (!translations[lang]) {
        try {
          const response = await fetch(`./translations/${lang}.json`);
          if (!response.ok) return;
          translations[lang] = await response.json();
        } catch (error) {
          console.error(`No se pudo cargar la traducción para ${lang}`, error);
          return;
        }
      }

      const dictionary = translations[lang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        const value = dictionary[key];
        if (typeof value === 'string' && value.trim() !== "") {
          el.innerHTML = value;
        }
      });

      document.querySelectorAll('.btn-lang').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${lang}`);
      if (activeBtn) activeBtn.classList.add('active');

      if (lang === 'ar' || lang === 'fa') {
        document.body.setAttribute('dir', 'rtl');
      } else {
        document.body.removeAttribute('dir');
      }
      currentLang = lang;
    }

    async function initLanguages() {
      const switcher = document.getElementById('lang-switcher');
      switcher.innerHTML = "";

      try {
        // Carga el archivo index_data.json desde la raíz
        const res = await fetch('./idiomas_data.json');
        if (!res.ok) throw new Error("No se pudo cargar index_data.json");
        const idiomasData = await res.json();

        // Recorre los idiomas definidos y valida si su archivo .json existe físicamente
        for (const [code, info] of Object.entries(idiomasData)) {
          try {
            const testRes = await fetch(`./translations/${code}.json`, { method: 'HEAD' });
            if (testRes.ok) {
              const btn = document.createElement('button');
              btn.id = `btn-${code}`;
              btn.className = 'btn-lang';
              btn.onclick = () => applyLanguage(code);
              
              const nombre = info.nombre || code.toUpperCase();
              btn.innerHTML = `${code.toUpperCase()} - ${nombre}`;
              switcher.appendChild(btn);
            }
          } catch (e) {
            // Si el archivo no existe o falla la petición, se omite el botón
          }
        }

        // Selección automática según el idioma del navegador o por defecto 'es'
        let userLang = navigator.language || navigator.userLanguage;
        let shortLang = userLang.split('-')[0];

        if (document.getElementById(`btn-${shortLang}`)) {
          applyLanguage(shortLang);
        } else if (document.getElementById(`btn-es`)) {
          applyLanguage('es');
        } else {
          const firstBtn = switcher.querySelector('.btn-lang');
          if (firstBtn) {
            const firstCode = firstBtn.id.replace('btn-', '');
            applyLanguage(firstCode);
          }
        }

      } catch (err) {
        console.error("Error al inicializar los idiomas:", err);
      }
    }

    document.addEventListener("DOMContentLoaded", initLanguages);
  </script>
</body>
</html>
